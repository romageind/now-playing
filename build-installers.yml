name: Build Windows and Linux installers

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  windows-x64:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Build Windows installer
        shell: pwsh
        run: ./packaging/build-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: NowPlaying-Windows-x64
          path: dist/installer/NowPlaying-Setup-x64.exe
          if-no-files-found: error

  linux-x64:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install native audio and AppImage build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libportaudio2 portaudio19-dev libfuse2 patchelf wget
      - name: Download appimagetool
        run: |
          mkdir -p tools
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O tools/appimagetool-x86_64.AppImage
          chmod +x tools/appimagetool-x86_64.AppImage
      - name: Build Linux AppImage
        run: ./packaging/build-linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: NowPlaying-Linux-x86_64
          path: dist/NowPlaying-x86_64.AppImage
          if-no-files-found: error
